[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-engine"
version = "0.1.0"
description = "The Python Engine — a distinguished-engineer course on Python, ML, and trading (stocks + options)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Python Engine Course" }]
keywords = ["python", "machine-learning", "trading", "quant", "options", "scanners"]

# Core runtime is intentionally tiny. Everything else is opt-in via extras
# so a reader can install only what a given module needs.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "yfinance>=0.2.40",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
core = [
  "scipy>=1.12",
  "matplotlib>=3.8",
  "polars>=1.0",
  "pyarrow>=15.0",
  "duckdb>=1.0",
]
ml = [
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "optuna>=3.6",
  "mapie>=0.8",
  "hmmlearn>=0.3",
  "arch>=7.0",
  "filterpy>=1.4",
  "ruptures>=1.1",
  "networkx>=3.2",
]
dl = [
  "torch>=2.3",
  "torchvision>=0.18",
]
options = [
  "py_vollib>=1.0.1",
  "QuantLib>=1.34",
]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.7",
  "mkdocs-with-pdf>=0.9.3",
  "mkdocs-jupyter>=0.24",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["engine*"]
exclude = ["course*", "tests*", "scripts*", "notebooks*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["engine"]
# Pragmatic strictness: catch real bugs without drowning in third-party stubs.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true        # numpy/pandas/scipy stubs are partial

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: tests that require internet access (deselect with -m 'not network')",
]

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
