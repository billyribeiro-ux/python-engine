name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + extras
        run: |
          python -m pip install -U pip
          pip install -e ".[core,ml,docs,dev]"

      - name: Ruff
        run: ruff check engine tests scripts

      - name: Black --check
        run: black --check engine tests scripts

      - name: Pytest (no-network)
        run: pytest -m "not network" --maxfail=1

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: End-to-end smoke (synthetic data)
        run: python scripts/end_to_end_smoke.py --no-network

      - name: Upload site artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 14
